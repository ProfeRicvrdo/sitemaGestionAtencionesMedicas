server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: paciente-ms
          uri: lb://pacienteMS
          predicates:
            - Path=/api/v1/pacientes/**
        - id: doctor-ms
          uri: lb://doctorMS
          predicates:
            - Path=/api/v1/doctores/**
        - id: atencion-ms
          uri: lb://atencionMS
          predicates:
            - Path=/api/v1/atenciones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
